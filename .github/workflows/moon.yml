name: Update tonight's moon

on:
  schedule:
    - cron: "30 18 * * *" # 00:00 IST every night
  workflow_dispatch:

permissions:
  contents: write

jobs:
  moon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/moon.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/moon.svg
          git diff --cached --quiet || (git commit -m "Update tonight's moon" && git push)
